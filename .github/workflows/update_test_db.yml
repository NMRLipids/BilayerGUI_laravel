name: DB TestUpdate

on:

  # Run after the test server has been (re)deployed successfully.
  # "Laravel CD Testing" itself only runs after "Laravel CI" passes,
  # so waiting on CD transitively guarantees CI passed too.
  workflow_run:
    workflows:
      - Laravel CD Testing
    types:
      - completed
    branches:
      - testing

  workflow_dispatch:
    inputs:
      force:
        description: 'Force update with potentially destructive operations (e.g. dropping tables). Use with caution.'
        # This option is intended for use when the database 
        # schema has changed in a way that cannot be handled by 
        # Laravel's built-in migration system, such as when
        # tables have been renamed or when there are complex relationships that require manual intervention. 
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: testing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Manual runs always proceed; automatic runs only when the CD
    # workflow that triggered us actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 30

    env:
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_HOST: ${{ secrets.TEST_HOST }}
      TEST_PATH: ${{ secrets.TEST_PATH }}
      SSH_OPTS: -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # Check out the exact commit that was deployed so we can diff it
      # to decide (a) whether a DB update is needed at all and
      # (b) whether the schema changed (which requires a forced rebuild).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Determine update scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: always update, honour the user-provided force input.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "force=${{ inputs.force }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD="${{ github.event.workflow_run.head_sha }}"
          if git rev-parse --verify --quiet "$HEAD^" >/dev/null; then
            BASE="$HEAD^"
          else
            # First commit on the branch: nothing to diff against.
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          # Only run when DB-relevant files changed.
          if echo "$CHANGED" | grep -qE '^(database/migrations/|database/seeders/|database/schema/|Python/UI_DB_Update\.py|Python/requirements\.txt)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No DB-relevant changes detected; skipping update."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

          # Force a fresh migration only when the schema file changed.
          if echo "$CHANGED" | grep -q '^database/schema/'; then
            echo "Schema change detected: enabling force."
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.scope.outputs.run == 'true'
        env:
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          TEST_KNOWN_HOSTS: ${{ secrets.TEST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TEST_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$TEST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

           
      - name: Update database
        if: steps.scope.outputs.run == 'true'
        run: |
          ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} <<EOF

          cd "${TEST_PATH}/Python"
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir --upgrade -r requirements.txt
          
          export FMDL_DATA_PATH="${TEST_PATH}/BilayerData"
          cd "${TEST_PATH}"
          git -C "\$FMDL_DATA_PATH" pull || git clone https://github.com/NMRLipids/BilayerData "\$FMDL_DATA_PATH"
          cd "\$FMDL_DATA_PATH"
          BILAYERDATA_VERSION=\$(git log -1 --oneline)
          export BILAYERDATA_VERSION
          cd "${TEST_PATH}"
          if [ "${{ steps.scope.outputs.force }}" = "true" ]; then
            php artisan migrate:fresh --force; 
          else
            php artisan migrate --force;
          fi
          # we don't want to drop the whole database
          # but we want to make sure that the schema is up to date. 
          # The UI_DB_Update.py script will handle the rest of the updates and will not delete any data.
          cd "${TEST_PATH}/Python"
          ./UI_DB_Update.py -c config.json --level ERROR
          cd "${TEST_PATH}"
          php artisan cache:clear
          
          EOF
