name: Laravel CD Production

on:
  workflow_run:
    workflows:
      - Laravel CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PATH: ${{ secrets.PROD_PATH }}
      SSH_OPTS: -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Package agent skill
        run: |
          rm -f public/fairmd-lipids.skill
          (cd public && zip -r fairmd-lipids.skill fairmd-lipids -x '*/__pycache__/*' '*.pyc')

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Create target directory
        run: |
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} <<EOF
          set -e
          mkdir -p '${PROD_PATH}'
          chgrp www-data '${PROD_PATH}'
          chmod g+s '${PROD_PATH}'
          EOF

      - name: Sync application files
        run: |
          rsync -rlz --delete --omit-dir-times --no-owner --no-group --no-perms \
            --exclude='.git/' \
            --exclude='.devcontainer/' \
            --exclude='Python/config.json' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='Python/.venv/' \
            --exclude='bootstrap/cache/' \
            --exclude='public/robots.txt' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='BilayerData/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='database/testing/' \
            --exclude='dev-tools/' \
            -e "ssh ${SSH_OPTS}" \
            ./ ${PROD_USER}@${PROD_HOST}:${PROD_PATH}/

      - name: Install production dependencies and optimize
        run: |
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} <<EOF
          set -e
          cd '${PROD_PATH}'
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache
          if [ ! -L public/storage ]; then
            php artisan storage:link
          fi
          EOF
